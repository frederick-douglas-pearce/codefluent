name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: Detect changed paths
    runs-on: ubuntu-latest
    outputs:
      webapp: ${{ steps.filter.outputs.webapp }}
    steps:
      - uses: actions/checkout@v6
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            webapp:
              - 'webapp/**'
              - 'shared/**'
              - '.github/workflows/ci.yml'

  test:
    name: Run Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: vscode-extension/package-lock.json

      - name: Install dependencies
        working-directory: vscode-extension
        run: npm ci

      - name: Compile TypeScript
        working-directory: vscode-extension
        run: npm run compile

      - name: Run tests
        working-directory: vscode-extension
        run: npm test

      - name: Package VSIX
        working-directory: vscode-extension
        run: npx @vscode/vsce package --allow-missing-repository

      - name: Verify VSIX runtime dependencies
        working-directory: vscode-extension
        run: |
          VSIX=$(ls *.vsix)
          echo "VSIX: $VSIX"
          if ! unzip -l "$VSIX" | grep -q '/node_modules/'; then
            echo "ERROR: VSIX missing node_modules/ — runtime deps excluded (check .vscodeignore)"
            exit 1
          fi

      - name: Audit dependencies
        working-directory: vscode-extension
        run: npm audit --audit-level=high

  test-webapp:
    name: Run Webapp Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: webapp/uv.lock

      - name: Verify uv.lock
        working-directory: webapp
        run: uv lock --check

      - name: Install dependencies
        working-directory: webapp
        run: uv sync --extra dev

      - name: Run tests
        working-directory: webapp
        run: uv run pytest tests/ -v

      - name: Audit dependencies
        working-directory: webapp
        run: uv export --no-hashes > /tmp/requirements.txt && uvx pip-audit -r /tmp/requirements.txt

  e2e:
    name: Run E2E Tests
    needs: changes
    if: needs.changes.outputs.webapp == 'true'
    # Pinned (rather than ubuntu-latest) so a future runner-image bump that
    # drops a library Chromium needs becomes an explicit, reviewable change
    # instead of silent CI breakage. See #319.
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v6

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: webapp/uv.lock

      - name: Install dependencies
        working-directory: webapp
        run: uv sync --extra dev

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('webapp/uv.lock') }}
          restore-keys: |
            playwright-${{ runner.os }}-

      # `playwright install-deps` is intentionally omitted: ubuntu-24.04
      # already ships the runtime libs Chromium needs (libnss3, libgtk-3-0,
      # libasound2, libgbm1, libxkbcommon0, libxcomposite1, libxdamage1,
      # libxfixes3, libcups2, libpango-1.0-0). The packages it would otherwise
      # apt-install are mostly Asian/Cyrillic font sets (fonts-ipafont-gothic,
      # fonts-wqy-zenhei, xfonts-cyrillic, etc.) that Latin-only test fixtures
      # never exercise. A 17-minute apt stall + failure on PR #318 (issue
      # #319) was caused by exactly that mirror flaking. If a missing-lib
      # error ever surfaces, add a single
      # `apt-get install -y --no-install-recommends <lib>` step rather than
      # reinstating the full font bundle.
      - name: Install Playwright browser
        working-directory: webapp
        run: uv run playwright install chromium

      - name: Run E2E tests
        working-directory: webapp
        run: uv run pytest tests/e2e/ -m e2e -v
