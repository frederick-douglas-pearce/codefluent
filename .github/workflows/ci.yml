name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: vscode-extension/package-lock.json

      - name: Install dependencies
        working-directory: vscode-extension
        run: npm ci

      - name: Compile TypeScript
        working-directory: vscode-extension
        run: npm run compile

      - name: Run tests
        working-directory: vscode-extension
        run: npm test

      - name: Package VSIX
        working-directory: vscode-extension
        run: npx @vscode/vsce package --allow-missing-repository

      - name: Verify VSIX runtime dependencies
        working-directory: vscode-extension
        run: |
          VSIX=$(ls *.vsix)
          echo "VSIX: $VSIX"
          if ! unzip -l "$VSIX" | grep -q '/node_modules/'; then
            echo "ERROR: VSIX missing node_modules/ — runtime deps excluded (check .vscodeignore)"
            exit 1
          fi

      - name: Audit dependencies
        working-directory: vscode-extension
        run: npm audit --audit-level=high

  test-webapp:
    name: Run Webapp Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: astral-sh/setup-uv@v7

      - name: Install dependencies
        working-directory: webapp
        run: uv sync --extra dev

      - name: Run tests
        working-directory: webapp
        run: uv run pytest tests/ -v

      - name: Audit dependencies
        working-directory: webapp
        run: uv export --no-hashes > /tmp/requirements.txt && uvx pip-audit -r /tmp/requirements.txt
