name: Release Please

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    outputs:
      releases_created: ${{ steps.release.outputs.releases_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v5
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      # Release Please bumps webapp/pyproject.toml via the generic updater but
      # has no concept of uv lockfiles. Without this, every release leaves
      # webapp/uv.lock pinned to the previous version (see #295, #296). When a
      # release-please PR is open or updated, regenerate the lockfile on its
      # branch so the release ships with a consistent state.
      - uses: astral-sh/setup-uv@v7
        if: steps.release.outputs.prs_created == 'true'

      - name: Sync webapp/uv.lock on release PR
        if: steps.release.outputs.prs_created == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_JSON: ${{ steps.release.outputs.pr }}
        run: |
          set -euo pipefail
          BRANCH=$(echo "$PR_JSON" | jq -r '.headBranchName')
          git clone --branch "$BRANCH" --depth 2 --quiet \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" release-pr
          cd release-pr
          (cd webapp && uv lock)
          if git diff --quiet webapp/uv.lock; then
            echo "uv.lock already in sync — nothing to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add webapp/uv.lock
          git commit -m "chore: regenerate webapp/uv.lock"
          git push origin "$BRANCH"

  build-release:
    name: Build & Release
    needs: release-please
    if: ${{ needs.release-please.outputs.releases_created == 'true' }}
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: vscode-extension/package-lock.json

      - name: Install dependencies
        working-directory: vscode-extension
        run: npm ci

      - name: Compile TypeScript
        working-directory: vscode-extension
        run: npm run compile

      - name: Run tests
        working-directory: vscode-extension
        run: npm test

      - name: Verify version matches tag
        working-directory: vscode-extension
        env:
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          echo "Tag: $TAG, package.json version: $PKG_VERSION"
          if [ "v$PKG_VERSION" != "$TAG" ]; then
            echo "ERROR: package.json version ($PKG_VERSION) does not match tag ($TAG)"
            exit 1
          fi

      - name: Package VSIX
        working-directory: vscode-extension
        run: npx @vscode/vsce package --allow-missing-repository

      - name: Verify VSIX runtime dependencies
        working-directory: vscode-extension
        run: |
          VSIX=$(ls *.vsix)
          echo "VSIX: $VSIX"
          if ! unzip -l "$VSIX" | grep -q '/node_modules/'; then
            echo "ERROR: VSIX missing node_modules/ — runtime deps excluded (check .vscodeignore)"
            exit 1
          fi
          echo "vsix_path=vscode-extension/$VSIX" >> "$GITHUB_ENV"
          echo "vsix_name=$VSIX" >> "$GITHUB_ENV"

      - name: Publish to VS Code Marketplace
        working-directory: vscode-extension
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: npx @vscode/vsce publish --pat "$VSCE_PAT"

      - name: Upload VSIX to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: |
          gh release upload "$TAG" "${{ env.vsix_path }}#${{ env.vsix_name }}" --clobber

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: |
          gh release edit "$TAG" --draft=false
