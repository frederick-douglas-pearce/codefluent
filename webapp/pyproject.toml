[project]
name = "codefluent"
version = "1.3.0" # x-release-please-version
description = "Personal AI fluency analytics for Claude Code users"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=0.94.0",
    "fastapi>=0.135.3",
    "python-dotenv>=1.2.2",
    "uvicorn>=0.41.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=0.24",
    "playwright>=1.52.0",
    "pytest-playwright>=0.6.2",
    "httpx2>=2.7.0",
]

[tool.pytest.ini_options]
addopts = "-m 'not live and not e2e'"
markers = [
    "live: tests that hit the real Anthropic API (run with 'pytest -m live')",
    "e2e: end-to-end tests via Playwright (run with 'pytest -m e2e' or 'pytest tests/e2e/')",
]
