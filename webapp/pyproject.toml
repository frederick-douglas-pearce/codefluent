[project]
name = "codefluent"
version = "1.2.0" # x-release-please-version
description = "Personal AI fluency analytics for Claude Code users"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=0.94.0",
    "fastapi>=0.135.3",
    "python-dotenv>=1.2.2",
    "uvicorn>=0.41.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0.3",
    "httpx>=0.28.1",
    "pytest-asyncio>=0.24",
]

[tool.pytest.ini_options]
addopts = "-m 'not live'"
markers = [
    "live: tests that hit the real Anthropic API (run with 'pytest -m live')",
]
